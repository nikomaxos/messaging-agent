server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100M;

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Public APK direct download shortcuts
    location /guardian {
        rewrite ^/guardian$ /api/public/guardian/download last;
    }
    location /apk {
        rewrite ^/apk$ /api/public/apk/download last;
    }

    # Proxy API to backend
    location /api/ {
        proxy_pass http://ma-api-gateway:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket for Android devices
    location /ws {
        proxy_pass http://ma-api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Proxy WebSocket admin
    location /ws-admin {
        proxy_pass http://ma-api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
