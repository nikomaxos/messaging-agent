server:
  port: 8087

spring:
  application:
    name: security-service
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    consumer:
      group-id: security-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

app:
  reporting:
    url: ${CORE_SERVICE_URL:http://localhost:8080}/api/reporting/security-events
  notifications:
    url: ${CORE_SERVICE_URL:http://localhost:8080}/api/notifications/alerts
