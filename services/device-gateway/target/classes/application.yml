server:
  port: 8083

spring:
  application:
    name: device-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/messaging_agent
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: device-gateway-group

logging:
  level:
    root: INFO
    com.messagingagent.device: DEBUG
