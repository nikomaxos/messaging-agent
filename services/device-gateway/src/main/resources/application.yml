server:
  port: 8083

spring:
  application:
    name: device-gateway
  security:
    jwt:
      secret: ${SPRING_SECURITY_JWT_SECRET:change-me-in-production-this-must-be-at-least-32-chars}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:messagingagent}
    username: ${DB_USER:myuser}
    password: ${DB_PASS:mypassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: device-gateway-group

logging:
  level:
    root: INFO
    com.messagingagent.device: DEBUG
