server:
  port: 8086

spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:messagingagent}
    username: ${DB_USER:msgagent}
    password: ${DB_PASS:msgagent}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

logging:
  level:
    root: INFO
    com.messagingagent.ai: DEBUG
