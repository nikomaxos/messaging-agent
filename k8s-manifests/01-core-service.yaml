apiVersion: apps/v1
kind: Deployment
metadata:
  name: ma-core-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ma-core-service
  template:
    metadata:
      labels:
        app: ma-core-service
    spec:
      containers:
      - name: ma-core-service
        image: messaging-agent-core-service:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx256m -Xms64m -XX:MaxMetaspaceSize=128m"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "messagingagent"
        - name: DB_USER
          value: "msgagent"
        - name: DB_PASS
          value: "msgagent"
        - name: SPRING_SECURITY_JWT_SECRET
          value: "change-me-in-production-this-must-be-at-least-32-chars"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ma-core-service
spec:
  selector:
    app: ma-core-service
  ports:
    - port: 8080
      targetPort: 8080
