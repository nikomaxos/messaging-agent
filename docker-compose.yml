services:
  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: ma-postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_DB: messagingagent
      POSTGRES_USER: msgagent
      POSTGRES_PASSWORD: msgagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msgagent -d messagingagent"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: ma-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ma-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ma-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application ───────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: ma-api-gateway
    restart: unless-stopped
    ports:
      - "9090:3000"
    environment:
      PORT: 3000
      CORE_SERVICE_URL: http://core-service:8080
      DEVICE_GATEWAY_URL: http://device-gateway:8083
      ROUTING_ENGINE_URL: http://routing-engine:8084
      PREFIX_UPDATER_URL: http://prefix-updater:8085
      JWT_SECRET: change-me-in-production-this-must-be-at-least-32-chars

  core-service:
    build:
      context: ./services/core-service
      dockerfile: Dockerfile
    container_name: ma-core-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: messagingagent
      DB_USER: msgagent
      DB_PASS: msgagent
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: change-me-in-production-this-must-be-at-least-32-chars

  device-gateway:
    build:
      context: ./services/device-gateway
      dockerfile: Dockerfile
    container_name: ma-device-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: messagingagent
      DB_USER: msgagent
      DB_PASS: msgagent
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: change-me-in-production-this-must-be-at-least-32-chars
    ports:
      - "8083:8083"

  routing-engine:
    build:
      context: ./services/routing-engine
      dockerfile: Dockerfile
    container_name: ma-routing-engine
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379

  smpp-edge:
    build:
      context: ./services/smpp-edge
      dockerfile: Dockerfile
    container_name: ma-smpp-edge
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      core-service:
        condition: service_started
    environment:
      KAFKA_BROKERS: kafka:29092
      SPRING_REDIS_HOST: redis
      CORE_SERVICE_URL: http://core-service:8080
    ports:
      - "2774:2775"

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: ma-admin-panel
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "8081:80"       # Web admin panel

  prefix-updater:
    build:
      context: ./services/prefix-updater
      dockerfile: Dockerfile
    container_name: ma-prefix-updater
    restart: unless-stopped
    environment:
      CORE_SERVICE_URL: http://core-service:8080
      PORT: 8085
    ports:
      - "8085:8085"



  # ─── Matrix Architecture ───────────────────────────────────────────────────

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: ma-synapse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./matrix/synapse:/data
    environment:
      - SYNAPSE_SERVER_NAME=synapse
      - SYNAPSE_REPORT_STATS=no
      - SYNAPSE_CONFIG_DIR=/data
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    ports:
      - "8008:8008"

  mautrix-gmessages:
    image: dock.mau.dev/mautrix/gmessages:latest
    container_name: ma-mautrix-gmessages
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_started
    volumes:
      - ./matrix/mautrix-gmessages:/data
    ports:
      - "29336:29336"

  element-web:
    image: vectorim/element-web:latest
    container_name: ma-element-web
    restart: unless-stopped
    volumes:
      - ./matrix/element-config.json:/app/config.json
    ports:
      - "8080:80"

  # ─── Deploy Agent (Production only) ─────────────────────────────────────
  # Auto-deploy sidecar: receives GitHub webhooks and triggers git pull + rebuild.
  # Only starts when using: docker compose --profile production up -d

  deploy-agent:
    build:
      context: ./deploy-agent
      dockerfile: Dockerfile
    container_name: ma-deploy-agent
    restart: unless-stopped
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-in-production}
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-main}
      DEPLOY_COOLDOWN: ${DEPLOY_COOLDOWN:-60}
      REPO_DIR: /repo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/repo
      - ~/.ssh:/app/.ssh_host:ro
    ports:
      - "8082:8082"

volumes:
  postgres_data:
  zookeeper_data:
  kafka_data:
  redis_data:
