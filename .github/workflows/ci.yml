name: CI — Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-legacy-monolith:
    name: Build Legacy Monolith (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Legacy Monolith
        working-directory: ./services/legacy-monolith
        run: mvn -B package -DskipTests

  build-core-service:
    name: Build Core Service (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Core Service
        working-directory: ./services/core-service
        run: mvn -B package -DskipTests

  build-routing-engine:
    name: Build Routing Engine (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Routing Engine
        working-directory: ./services/routing-engine
        run: mvn -B package -DskipTests

  build-smpp-edge:
    name: Build SMPP Edge Node (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build SMPP Edge Node
        working-directory: ./services/smpp-edge
        run: mvn -B package -DskipTests

  build-rcs-mautrix:
    name: Build RCS Mautrix Worker (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build RCS Mautrix Worker
        working-directory: ./services/rcs-mautrix
        run: mvn -B package -DskipTests

  build-admin-panel:
    name: Build Admin Panel (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install dependencies
        working-directory: ./admin-panel
        run: npm ci

      - name: Build admin panel
        working-directory: ./admin-panel
        run: npm run build
